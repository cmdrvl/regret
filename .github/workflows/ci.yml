name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Test basic functionality
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            ./target/release/regret --version
            ./target/release/regret --help || true
          else
            ./target/release/regret.exe --version
            ./target/release/regret.exe --help || true
          fi
        shell: bash

  test-nextest:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run tests with nextest
        run: cargo nextest run --all-features

  lint-scripts:
    name: Lint Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ShellCheck for Unix install script
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint install.sh (if exists)
        run: |
          if [ -f scripts/install.sh ]; then
            shellcheck scripts/install.sh
          elif [ -f install.sh ]; then
            shellcheck install.sh
          else
            echo "No install.sh found - skipping shellcheck"
          fi

      # PowerShell syntax check (parse without executing)
      - name: Validate PowerShell syntax (if exists)
        shell: pwsh
        run: |
          $scriptPath = "scripts/install.ps1"
          if (Test-Path $scriptPath) {
            try {
              $errors = @()
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path $scriptPath).Path,
                [ref]$null,
                [ref]$errors
              )
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Error $_.ToString() }
                exit 1
              }
              Write-Host "PowerShell syntax OK: $scriptPath"
            } catch {
              Write-Error "Failed to parse $scriptPath`: $_"
              exit 1
            }
          } else {
            Write-Host "No install.ps1 found - skipping"
          }

  # Summary job to require all checks to pass
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [fmt, clippy, build, test-nextest, lint-scripts]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]]; then
            echo "Format job failed"
            exit 1
          fi
          if [[ "${{ needs.clippy.result }}" != "success" ]]; then
            echo "Clippy job failed"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build job failed"
            exit 1
          fi
          if [[ "${{ needs.test-nextest.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi
          if [[ "${{ needs.lint-scripts.result }}" != "success" ]]; then
            echo "Script linting job failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"